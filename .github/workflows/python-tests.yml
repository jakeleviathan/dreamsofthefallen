name: Dreams of the Fallen tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: traditional-mud
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run regression suite
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Build official Mudlet package
        run: python mudlet/DreamsOfTheFallenHUD/build_package.py
      - name: Verify modern Mudlet package
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path

          package = Path("mudlet/DreamsOfTheFallenHUD/DreamsOfTheFallenHUD.mpackage")
          assert package.exists() and package.stat().st_size > 1000
          with zipfile.ZipFile(package) as zf:
              names = set(zf.namelist())
              assert {"DreamsOfTheFallenHUD.xml", "config.lua"} <= names
              xml = zf.read("DreamsOfTheFallenHUD.xml").decode("utf-8")
              config = zf.read("config.lua").decode("utf-8")
          for marker in ("Dreams.Room", "Dreams.Party", "Dreams.Quests", "Dreams.Inventory", "Dreams.Abilities", "Dreams.Context", "Dreams.Onboarding", "Geyser.Mapper"):
              assert marker in xml, marker
          assert 'version = "2.0.0"' in config
          print("MODERN_MUDLET_PACKAGE_OK")
          PY
      - name: Build runnable server source bundle
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile

          root = Path('.')
          out = Path('DreamsOfTheFallenServer.zip')
          excluded_parts = {'__pycache__', '.pytest_cache'}
          excluded_prefixes = ('tests/', 'backups/', 'logs/')
          excluded_names = {'mud.db'}

          with zipfile.ZipFile(out, 'w', compression=zipfile.ZIP_DEFLATED) as zf:
              for path in sorted(root.rglob('*')):
                  if not path.is_file():
                      continue
                  rel = path.as_posix()
                  if any(part in excluded_parts for part in path.parts):
                      continue
                  if rel.startswith(excluded_prefixes):
                      continue
                  if path.name in excluded_names:
                      continue
                  zf.write(path, arcname=f'DreamsOfTheFallenServer/{rel}')

          assert out.exists() and out.stat().st_size > 10000
          print(f'SERVER_SOURCE_BUNDLE_OK {out.stat().st_size} bytes')
          PY
      - name: Upload official Mudlet package
        uses: actions/upload-artifact@v4
        with:
          name: DreamsOfTheFallenHUD
          path: traditional-mud/mudlet/DreamsOfTheFallenHUD/DreamsOfTheFallenHUD.mpackage
          if-no-files-found: error
      - name: Upload runnable server source bundle
        uses: actions/upload-artifact@v4
        with:
          name: DreamsOfTheFallenServer
          path: traditional-mud/DreamsOfTheFallenServer.zip
          if-no-files-found: error
